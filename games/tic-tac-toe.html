<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Tic-Tac-Toe</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#101b35,#05050d 65%);
    color:white;
    font-family:Arial,sans-serif;
}

.game{
    text-align:center;
    width:min(92vw,500px);
}

h1{
    color:#00e5ff;
    text-shadow:0 0 20px #00e5ff;
    margin-bottom:5px;
}

.status{
    color:#aaa;
    margin-bottom:20px;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.cell{
    aspect-ratio:1;
    border:1px solid #00e5ff55;
    border-radius:15px;
    background:#10101d;
    color:white;
    font-size:clamp(45px,14vw,80px);
    font-weight:900;
    cursor:pointer;
    transition:.2s;
    box-shadow:inset 0 0 20px #00e5ff08;
}

.cell:hover{
    border-color:#00e5ff;
    box-shadow:0 0 25px #00e5ff44;
    transform:scale(1.04);
}

.cell.x{
    color:#00e5ff;
    text-shadow:0 0 25px #00e5ff;
    animation:pop .25s ease;
}

.cell.o{
    color:#ff4df3;
    text-shadow:0 0 25px #ff4df3;
    animation:pop .25s ease;
}

.cell.win{
    animation:winPulse .7s infinite alternate;
}

@keyframes pop{
    0%{transform:scale(.3);opacity:0}
    70%{transform:scale(1.15)}
    100%{transform:scale(1);opacity:1}
}

@keyframes winPulse{
    from{box-shadow:0 0 10px currentColor}
    to{box-shadow:0 0 45px currentColor}
}

button.restart{
    margin-top:20px;
    padding:14px 30px;
    border:1px solid #00e5ff;
    border-radius:10px;
    background:#00e5ff;
    color:#001014;
    font-weight:900;
    cursor:pointer;
}

button.restart:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #00e5ff88;
}

#result{
    margin-top:15px;
    min-height:28px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="game">

<h1>❌⭕ TIC-TAC-TOE</h1>
<div class="status" id="status">Player X's turn</div>

<div class="board" id="board">
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
    <button class="cell"></button>
</div>

<div id="result"></div>

<button class="restart" id="restart">🔄 RESTART</button>

</div>

<script>
const cells=[...document.querySelectorAll(".cell")];
const status=document.getElementById("status");
const result=document.getElementById("result");
const restart=document.getElementById("restart");

let board=["","","","","","","","",""];
let player="X";
let gameOver=false;

const wins=[
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

function sound(freq,duration,type="sine"){
    try{
        const AudioContext=window.AudioContext||window.webkitAudioContext;
        const audio=new AudioContext();

        const osc=audio.createOscillator();
        const gain=audio.createGain();

        osc.type=type;
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(.08,audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.start();
        osc.stop(audio.currentTime+duration);
    }catch(e){}
}

function clickCell(index){
    if(board[index]||gameOver)return;

    board[index]=player;

    cells[index].textContent=player;
    cells[index].classList.add(player.toLowerCase());

    sound(player==="X"?500:350,.12);

    const winning=getWinner();

    if(winning){
        gameOver=true;

        winning.forEach(i=>{
            cells[i].classList.add("win");
        });

        result.textContent=`🏆 Player ${player} wins!`;
        status.textContent="GAME OVER";

        sound(700,.15);
        setTimeout(()=>sound(900,.25),150);

        return;
    }

    if(board.every(Boolean)){
        gameOver=true;
        result.textContent="🤝 It's a draw!";
        status.textContent="DRAW";
        sound(250,.25);
        return;
    }

    player=player==="X"?"O":"X";
    status.textContent=`Player ${player}'s turn`;
}

function getWinner(){
    for(const combo of wins){
        const[a,b,c]=combo;

        if(
            board[a] &&
            board[a]===board[b] &&
            board[a]===board[c]
        ){
            return combo;
        }
    }

    return null;
}

cells.forEach((cell,index)=>{
    cell.addEventListener("click",()=>{
        clickCell(index);
    });
});

restart.addEventListener("click",()=>{
    board=["","","","","","","","",""];
    player="X";
    gameOver=false;

    cells.forEach(cell=>{
        cell.textContent="";
        cell.className="cell";
    });

    result.textContent="";
    status.textContent="Player X's turn";

    sound(600,.08);
});
</script>

</body>
</html>
